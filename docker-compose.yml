services:
  postgres:
    image: ${PGGRAPH_QUICKSTART_IMAGE:-pggraph:quickstart-local}
    build: .
    ports:
      - "${PGGRAPH_QUICKSTART_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graph
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
