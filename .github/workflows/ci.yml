name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Release-gate tier to run
        required: true
        default: pr
        type: choice
        options: [pr, nightly, rc, full-matrix]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    name: Required release gate
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier == 'pr')
    runs-on: [self-hosted, pggraph-release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install locked documentation checks
        run: sfw npm ci --prefix docs
      - name: Run required checks
        run: scripts/run_release.py --tier pr --evidence release/evidence/pr.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-release-evidence-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error
          retention-days: 30

  nightly:
    name: Nightly release gate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly')
    runs-on: [self-hosted, pggraph-release]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install locked documentation checks
        run: sfw npm ci --prefix docs
      - name: Run nightly checks
        run: scripts/run_release.py --tier nightly --evidence release/evidence/nightly.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-release-evidence-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error
          retention-days: 90

  release-candidate:
    name: ${{ inputs.tier }} release evidence
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'rc' || inputs.tier == 'full-matrix')
    runs-on: [self-hosted, pggraph-release]
    environment: release-candidate
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Require an immutable clean source commit
        run: |
          test -z "$(git status --porcelain=v1)"
          git rev-parse HEAD
      - name: Install locked documentation checks
        run: sfw npm ci --prefix docs
      - name: Run release candidate checks
        run: scripts/run_release.py --tier "${{ inputs.tier }}" --evidence "release/evidence/${{ inputs.tier }}.json"
      - name: Verify retained evidence
        if: success()
        run: |
          scripts/verify_release_evidence.py \
            "release/evidence/${{ inputs.tier }}.json" \
            --tier "${{ inputs.tier }}" \
            --commit "$(git rev-parse HEAD)"
      - name: Retain release candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ inputs.tier }}-${{ github.sha }}-${{ github.run_id }}
          path: release/evidence/
          if-no-files-found: error
          retention-days: 90
